<!DOCTYPE html>
<html>

<head>
    <title>StayFix - Hostel Complaint System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1> 🏢StayFix</h1>

    <p class="tagline">Hostel Complaint Management System</p>

    <div class="container">

        <h2>Submit a Complaint</h2>

        <form id="complaintForm">

            <label>Resident Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Room Number</label>
            <input type="text" id="room" placeholder="Enter room number">

            <label>Category</label>
            <select id="category">
                <option>Select category</option>
                <option>Plumbing</option>
                <option>Electricity</option>
                <option>Water Supply</option>
                <option>Internet</option>
                <option>Housekeeping</option>
                <option>Maintenance</option>
            </select>

            <label>Description</label>
            <textarea id="description" placeholder="Describe your problem"></textarea>

            <label>Priority</label>
            <select id="priority">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
            </select>

            <label>Date</label>
            <input type="date" id="date">

            <button type="button" id="submitBtn">Submit Complaint</button>

        </form>

        <h2>Submitted Complaints</h2>

        <div id="complaintList"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
